<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Luana 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-container"></div>
    
    <div class="container">
        <h1 class="glow">Luana</h1>
        <h2 class="subtitle">Tengo algo para decirte...</h2>
        
        <div class="invitation">
            <p>¿Querés salir conmigo?</p>
            <p class="details">Una cita especial solo para vos 💖</p>
        </div>
        
        <button class="btn" onclick="mostrarMensaje()">Decir que SÍ 💕</button>
        
        <div id="mensaje" class="hidden">
            <h3>¡Sabía que ibas a decir que sí! 🥰</h3>
            <p>Te quiero mucho, Luana 💕</p>
            <p>Nos vemos pronto ❤️</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
